<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex items-center justify-center h-screen">
    <div class="bg-white shadow-lg p-8 rounded-xl w-96">
        <h1 class="text-2xl font-bold text-center mb-6">로그인</h1>

        <form action="/auth/login" method="post" class="space-y-4">
            <input name="username" placeholder="아이디"
                   class="w-full p-3 border rounded-lg"/>

            <input name="password" type="password" placeholder="비밀번호"
                   class="w-full p-3 border rounded-lg"/>

            <button class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700 transition">
                로그인
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            계정이 없나요?
            <a href="/auth/signup" class="text-blue-600 font-semibold hover:underline">회원가입</a>
        </p>
    </div>
</div>
</body>
</html>
