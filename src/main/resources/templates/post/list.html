<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div class="max-w-3xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">게시판</h1>
        <a href="/posts/new"
           class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
            글쓰기
        </a>
    </div>

    <div th:if="${posts.size() == 0}" class="text-gray-500">
        아직 글이 없습니다.
    </div>

    <div class="space-y-4">
        <div th:each="post : ${posts}"
             class="bg-white p-5 rounded-xl shadow hover:shadow-lg transition cursor-pointer"
             th:onclick="'location.href=\'/posts/' + ${post.id} + '\';'">

            <h2 class="text-xl font-bold mb-2" th:text="${post.title}"></h2>

            <div class="text-gray-600 text-sm">
                조회수 <span th:text="${post.views}"></span> ·
                작성자 <span th:text="${post.author.username}"></span> ·
                <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
