<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow">

    <h1 class="text-2xl font-bold mb-6">글쓰기</h1>

    <form action="/posts/new" method="post" class="space-y-4">
        <input name="title" placeholder="제목"
               class="w-full p-3 border rounded-lg"/>

        <textarea name="content" placeholder="내용을 입력하세요"
                  class="w-full p-3 border rounded-lg h-48"></textarea>

        <button class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700">
            작성
        </button>
    </form>
</div>
</body>
</html>
