<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div class="max-w-3xl mx-auto">

  <!-- 게시글 -->
  <div class="bg-white p-8 rounded-xl shadow mb-8">
    <h1 class="text-3xl font-bold mb-4" th:text="${post.title}"></h1>

    <div class="text-gray-500 mb-6">
      작성자 <span th:text="${post.author.username}"></span> ·
      조회수 <span th:text="${post.views}"></span> ·
      <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
    </div>

    <p class="whitespace-pre-line text-lg" th:text="${post.content}"></p>

    <!-- 삭제 버튼 -->
    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="mt-6">
      <button class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
        게시글 삭제
      </button>
    </form>
  </div>

  <!-- 댓글 목록 -->
  <h2 class="text-2xl font-bold mb-4">댓글</h2>

  <div class="space-y-4 mb-8">
    <div th:each="comment : ${comments}"
         class="bg-white p-5 rounded-xl shadow">

      <p class="text-gray-700 whitespace-pre-line"
         th:text="${comment.content}"></p>

      <div class="text-gray-500 text-sm mt-2">
        <span th:text="${comment.author.username}"></span> ·
        <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
      </div>

      <form th:action="@{/comments/{id}/delete(id=${comment.id})}"
            method="post" class="mt-3">
        <input type="hidden" name="postId" th:value="${post.id}"/>
        <button class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600">
          삭제
        </button>
      </form>
    </div>
  </div>

  <!-- 댓글 작성 -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h3 class="text-xl font-bold mb-4">댓글 작성</h3>

    <form action="/comments/add" method="post" class="space-y-4">
      <input type="hidden" name="postId" th:value="${post.id}"/>

      <textarea name="content"
                class="w-full p-3 border rounded-lg h-28"
                placeholder="댓글을 입력하세요"></textarea>

      <button class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
        댓글 작성
      </button>
    </form>
  </div>
</div>
</body>
</html>
